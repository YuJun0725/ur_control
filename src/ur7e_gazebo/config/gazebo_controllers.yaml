controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Keep the public controller and action names used by MoveIt, while using
    # the simulator-compatible standard trajectory controller internally.
    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.5
      # Position-interface simulation has a small first-order tracking lag.
      # Keep strict final tolerances but allow that bounded transient error.
      shoulder_pan_joint: {trajectory: 0.3, goal: 0.1}
      shoulder_lift_joint: {trajectory: 0.3, goal: 0.1}
      elbow_joint: {trajectory: 0.3, goal: 0.1}
      wrist_1_joint: {trajectory: 0.3, goal: 0.1}
      wrist_2_joint: {trajectory: 0.3, goal: 0.1}
      wrist_3_joint: {trajectory: 0.3, goal: 0.1}

gripper_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      robotiq_85_left_knuckle_joint: {trajectory: 0.08, goal: 0.03}
